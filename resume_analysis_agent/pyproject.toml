[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-analysis-agent"
version = "1.0.0"
description = "Autonomous, explainable AI Resume-to-Score evaluation agent with fairness guardrails and GitHub enrichment"
readme = "README.md"
authors = [{ name = "Eagle Vision AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
resume-agent = "resume_analysis_agent.cli:main"
